version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: talkweb-app:1.0.0
    container_name: talkweb-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - EXISTING_DB_HOST=${EXISTING_DB_HOST:-localhost}
      - EXISTING_DB_PORT=${EXISTING_DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-chatapp}
      - DB_USERNAME=${DB_USERNAME:-chatapp_user}
      - DB_PASSWORD=${DB_PASSWORD:-your_secure_password}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - AVATAR_MAX_SIZE_KB=${AVATAR_MAX_SIZE_KB:-500}
      - SPRING_PROFILES_ACTIVE=prod
